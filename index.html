<!DOCTYPE html>
<html lang="pt-BR" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo de Colorir Interativo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none; /* Bloqueia o efeito de rolar/puxar no mobile */
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .tool-btn.active-tool {
            background-color: #e0e7ff;
            border-color: #6366f1;
            color: #4338ca;
            transform: scale(1.02);
        }

        .color-swatch.active {
            transform: scale(1.15);
            outline: 3px solid #3b82f6;
            outline-offset: 2px;
        }

        .btn-bounce {
            transition: transform 0.1s ease;
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }

        /* Bloqueia gestos de toque no container do canvas */
        #drawing-container {
            touch-action: none;
        }

        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 h-full w-full flex flex-col fixed inset-0 overflow-hidden select-none">

    <!-- CABEÇALHO COMPACTO (Mobile First) -->
    <header class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white px-3 py-2 shrink-0 shadow-md flex items-center justify-between z-10">
        <div class="flex items-center gap-2">
            <div class="bg-white p-1.5 rounded-full text-pink-500 shadow">
                <i data-lucide="palette" class="w-5 h-5"></i>
            </div>
            <h1 class="text-base font-bold tracking-wide leading-tight">Pintando e Colorindo</h1>
        </div>

        <div class="flex items-center gap-1.5">
            <button id="finish-btn" class="btn-bounce bg-emerald-500 active:bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg shadow font-bold text-xs flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>Pronto!</span>
            </button>
            <button id="download-btn" class="btn-bounce bg-amber-400 active:bg-amber-500 text-slate-900 px-2.5 py-1.5 rounded-lg shadow font-bold text-xs flex items-center gap-1">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Baixar</span>
            </button>
        </div>
    </header>

    <!-- PAINEL FIXO SUPERIOR: FERRAMENTAS + PALETA DE CORES -->
    <div class="bg-white border-b border-slate-200 shadow-sm shrink-0 flex flex-col gap-2 p-2 z-10">
        
        <!-- LINHA 1: Ferramentas + Ações + Ajustes -->
        <div class="flex items-center justify-between gap-1.5 overflow-x-auto custom-scrollbar pb-1">
            
            <!-- Ferramentas Principais -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl shrink-0">
                <button id="tool-fill" class="tool-btn active-tool bg-white p-2 rounded-lg flex items-center gap-1 text-slate-700 transition">
                    <i data-lucide="paint-bucket" class="w-4 h-4"></i>
                    <span class="text-xs font-bold hidden sm:inline">Balde</span>
                </button>
                <button id="tool-brush" class="tool-btn p-2 rounded-lg flex items-center gap-1 text-slate-700 transition">
                    <i data-lucide="brush" class="w-4 h-4"></i>
                    <span class="text-xs font-bold hidden sm:inline">Pincel</span>
                </button>
                <button id="tool-eraser" class="tool-btn p-2 rounded-lg flex items-center gap-1 text-slate-700 transition">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                    <span class="text-xs font-bold hidden sm:inline">Borracha</span>
                </button>
            </div>

            <!-- Desfazer / Refazer / Limpar -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl shrink-0">
                <button id="btn-undo" class="btn-bounce p-2 hover:bg-white rounded-lg text-slate-700 transition" title="Desfazer">
                    <i data-lucide="undo" class="w-4 h-4"></i>
                </button>
                <button id="btn-redo" class="btn-bounce p-2 hover:bg-white rounded-lg text-slate-700 transition" title="Refazer">
                    <i data-lucide="redo" class="w-4 h-4"></i>
                </button>
                <button id="btn-clear" class="btn-bounce p-2 hover:bg-red-100 text-red-600 rounded-lg transition" title="Limpar tudo">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Slider de Espessura/Tolerância Dinâmico -->
            <div class="flex items-center gap-2 bg-slate-100 px-2 py-1 rounded-xl shrink-0 min-w-[130px]">
                <span id="slider-label" class="text-[10px] font-bold text-slate-500 uppercase">Tam:</span>
                <input type="range" id="dynamic-slider" min="2" max="40" value="12" class="w-16 accent-indigo-600 cursor-pointer">
                <span id="slider-val" class="text-xs font-extrabold text-indigo-600 min-w-[24px]">12</span>
            </div>

            <!-- Cor Atual / Custom Color -->
            <div class="flex items-center gap-1.5 shrink-0 pl-1">
                <div id="current-color-preview" class="w-7 h-7 rounded-full border-2 border-slate-200 shadow bg-pink-500"></div>
                <label for="custom-color-picker" class="cursor-pointer bg-slate-100 p-1.5 rounded-lg border border-slate-200 text-slate-700 flex items-center justify-center">
                    <i data-lucide="pipette" class="w-4 h-4 text-indigo-600"></i>
                    <input type="color" id="custom-color-picker" value="#ec4899" class="opacity-0 w-0 h-0 absolute">
                </label>
            </div>
        </div>

        <!-- LINHA 2: PALETA DE CORES FIXA ABAIXO -->
        <div id="color-palette" class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar py-0.5 px-1 w-full justify-start md:justify-center shrink-0">
            <!-- Cores inseridas via JS -->
        </div>
    </div>

    <!-- ÁREA CENTRAL DE PINTURA E SELEÇÃO DE DESENHOS -->
    <main class="flex-1 w-full max-w-5xl mx-auto p-2 flex flex-col md:flex-row gap-2 items-center justify-center overflow-hidden min-h-0">
        
        <!-- Carrossel/Seleção de Desenhos (Horizontal no Mobile, Vertical no Desktop) -->
        <section class="w-full md:w-28 shrink-0 bg-white p-1.5 rounded-xl shadow-sm border border-slate-200">
            <div id="image-selector" class="flex md:flex-col gap-2 overflow-x-auto md:overflow-y-auto custom-scrollbar max-h-16 md:max-h-[70vh]">
                <!-- Miniaturas geradas por JS -->
            </div>
        </section>

        <!-- Canvas Interativo -->
        <section class="flex-1 w-full h-full flex items-center justify-center min-h-0 relative">
            <div id="drawing-container" class="relative aspect-square max-w-full max-h-full border-2 border-white shadow-lg rounded-xl bg-white overflow-hidden flex items-center justify-center">
                <!-- Canvas Único (Desenho + Linhas Preservadas) -->
                <canvas id="main-canvas" width="600" height="600" class="w-full h-full touch-none"></canvas>
            </div>
        </section>
    </main>

    <script>
        /* CONFIGURAÇÃO DOS DESENHOS */
        const DESENHOS_CONFIGURADOS = [
            { id: 'desenho1', titulo: 'Desenho 1', src: 'imagens/desenho1.png' },
            { id: 'desenho2', titulo: 'Desenho 2', src: 'imagens/desenho2.png' }
        ];

        /* PALETA DE CORES */
        const CORES_PALETA = [
            '#EF4444', '#F97316', '#F59E0B', '#10B981', '#06B6D4', 
            '#3B82F6', '#6366F1', '#8B5CF6', '#EC4899', '#F43F5E',
            '#84CC16', '#14B8A6', '#A855F7', '#F472B6', '#FBBF24',
            '#38BDF8', '#4ADE80', '#FB7185', '#000000', '#FFFFFF'
        ];

        /* ESTADO DA APLICAÇÃO */
        let corAtual = '#EC4899';
        let ferramentaAtual = 'fill'; // 'fill', 'brush', 'eraser'
        let espessuraPincel = 12;
        let toleranciaBalde = 35;
        let imagemAtualIndex = 0;

        let estadoImagemOriginal = null;
        let imagemLinhasCanvas = null; // Guarda a imagem de linhas do desenho

        /* HISTÓRICO (UNDO / REDO) */
        let historicoPassos = [];
        let historicoIndice = -1;
        const MAX_HISTORICO = 20;

        /* CANVAS */
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        /* SINTETIZADOR SOM */
        let synth = null;
        function tocarSom(nota = 'C5') {
            try {
                if (!synth && typeof Tone !== 'undefined') {
                    synth = new Tone.Synth({
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                    }).toDestination();
                    synth.volume.value = -12;
                }
                if (synth) {
                    if (Tone.context.state !== 'running') Tone.start();
                    synth.triggerAttackRelease(nota, '8n');
                }
            } catch (e) {}
        }

        /* EVITA QUALQUER MOVIMENTO DE TELA INDESEJADO NO MOBILE */
        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        /* RENDERIZAR INTERFACE */
        function renderizarSelecaoImagens() {
            const container = document.getElementById('image-selector');
            container.innerHTML = '';

            DESENHOS_CONFIGURADOS.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `btn-bounce cursor-pointer p-1 rounded-lg border-2 transition flex-shrink-0 w-12 h-12 md:w-20 md:h-20 bg-white flex items-center justify-center ${
                    index === imagemAtualIndex ? 'border-indigo-600 ring-2 ring-indigo-200' : 'border-slate-200'
                }`;
                
                card.innerHTML = `<img src="${item.src}" alt="${item.titulo}" class="w-full h-full object-contain pointer-events-none">`;

                card.addEventListener('click', () => {
                    if (imagemAtualIndex !== index) {
                        imagemAtualIndex = index;
                        carregarImagem(DESENHOS_CONFIGURADOS[index].src);
                        renderizarSelecaoImagens();
                        tocarSom('G4');
                    }
                });

                container.appendChild(card);
            });
        }

        function renderizarPaleta() {
            const container = document.getElementById('color-palette');
            container.innerHTML = '';

            CORES_PALETA.forEach(cor => {
                const btn = document.createElement('button');
                btn.className = `color-swatch w-6 h-6 sm:w-7 sm:h-7 rounded-full border-2 border-white shadow-sm flex-shrink-0 transition-transform ${cor === corAtual ? 'active' : ''}`;
                btn.style.backgroundColor = cor;
                btn.addEventListener('click', () => selecionarCor(cor, btn));
                container.appendChild(btn);
            });
        }

        function selecionarCor(cor, elemento = null) {
            corAtual = cor;
            document.getElementById('current-color-preview').style.backgroundColor = cor;
            document.getElementById('custom-color-picker').value = cor;

            document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
            if (elemento) elemento.classList.add('active');
            tocarSom('C4');
        }

        /* CARREGAMENTO DE IMAGEM E BLOQUEIO DE LINHAS PRETAS */
        function carregarImagem(caminhoSrc) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            
            img.onload = () => {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const escala = Math.min(canvas.width / img.width, canvas.height / img.height);
                const largura = img.width * escala;
                const altura = img.height * escala;
                const x = (canvas.width - largura) / 2;
                const y = (canvas.height - altura) / 2;

                ctx.drawImage(img, x, y, largura, altura);

                // Armazena a imagem das linhas contornadas
                imagemLinhasCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
                salvarEstadoBase();
                reiniciarHistorico();
            };

            img.src = caminhoSrc;
        }

        function salvarEstadoBase() {
            estadoImagemOriginal = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        /* HISTÓRICO */
        function reiniciarHistorico() {
            historicoPassos = [];
            historicoIndice = -1;
            salvarPassoHistorico();
        }

        function salvarPassoHistorico() {
            if (historicoIndice < historicoPassos.length - 1) {
                historicoPassos = historicoPassos.slice(0, historicoIndice + 1);
            }
            historicoPassos.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (historicoPassos.length > MAX_HISTORICO) {
                historicoPassos.shift();
            } else {
                historicoIndice++;
            }
        }

        function desfazer() {
            if (historicoIndice > 0) {
                historicoIndice--;
                ctx.putImageData(historicoPassos[historicoIndice], 0, 0);
                tocarSom('D4');
            }
        }

        function refazer() {
            if (historicoIndice < historicoPassos.length - 1) {
                historicoIndice++;
                ctx.putImageData(historicoPassos[historicoIndice], 0, 0);
                tocarSom('F4');
            }
        }

        /* RESTAURAÇÃO DE LINHAS (Impede a borracha/pincel de apagar o contorno preto) */
        function protegerLinhasDoDesenho() {
            if (!imagemLinhasCanvas) return;

            const atualData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const dataAtual = atualData.data;
            const dataLinhas = imagemLinhasCanvas.data;

            // Restaura pixels escuros/linhas pretas do desenho original
            for (let i = 0; i < dataLinhas.length; i += 4) {
                const r = dataLinhas[i];
                const g = dataLinhas[i + 1];
                const b = dataLinhas[i + 2];
                
                // Se o pixel original for uma linha escura (contorno do desenho)
                if (r < 100 && g < 100 && b < 100) {
                    dataAtual[i] = r;
                    dataAtual[i + 1] = g;
                    dataAtual[i + 2] = b;
                    dataAtual[i + 3] = 255;
                }
            }

            ctx.putImageData(atualData, 0, 0);
        }

        /* PREENCHIMENTO BALDE (FLOOD FILL) */
        function hexParaRgba(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
        }

        function preenchimentoBalde(startX, startY, corPreenchimentoHex, tolerancia) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const largura = canvas.width;
            const altura = canvas.height;

            const posInicial = (startY * largura + startX) * 4;
            const startR = data[posInicial];
            const startG = data[posInicial + 1];
            const startB = data[posInicial + 2];
            const startA = data[posInicial + 3];

            const [fillR, fillG, fillB, fillA] = hexParaRgba(corPreenchimentoHex);

            if (Math.abs(startR - fillR) < 4 && Math.abs(startG - fillG) < 4 &&
                Math.abs(startB - fillB) < 4 && Math.abs(startA - fillA) < 4) return;

            function coincideCor(pos) {
                return (
                    Math.abs(data[pos] - startR) <= tolerancia &&
                    Math.abs(data[pos + 1] - startG) <= tolerancia &&
                    Math.abs(data[pos + 2] - startB) <= tolerancia &&
                    Math.abs(data[pos + 3] - startA) <= tolerancia
                );
            }

            const filaPixels = [startX, startY];
            while (filaPixels.length > 0) {
                const y = filaPixels.pop();
                const x = filaPixels.pop();
                let posAtual = (y * largura + x) * 4;

                let x1 = x;
                while (x1 >= 0 && coincideCor(posAtual)) {
                    x1--;
                    posAtual -= 4;
                }
                x1++;
                posAtual += 4;

                let alcancouEsquerda = false;
                let alcancouDireita = false;

                while (x1 < largura && coincideCor(posAtual)) {
                    data[posAtual] = fillR;
                    data[posAtual + 1] = fillG;
                    data[posAtual + 2] = fillB;
                    data[posAtual + 3] = fillA;

                    if (y > 0) {
                        const posCima = posAtual - largura * 4;
                        if (coincideCor(posCima)) {
                            if (!alcancouEsquerda) { filaPixels.push(x1, y - 1); alcancouEsquerda = true; }
                        } else if (alcancouEsquerda) { alcancouEsquerda = false; }
                    }

                    if (y < altura - 1) {
                        const posBaixo = posAtual + largura * 4;
                        if (coincideCor(posBaixo)) {
                            if (!alcancouDireita) { filaPixels.push(x1, y + 1); alcancouDireita = true; }
                        } else if (alcancouDireita) { alcancouDireita = false; }
                    }

                    x1++;
                    posAtual += 4;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            protegerLinhasDoDesenho();
            salvarPassoHistorico();
            tocarSom('E5');
        }

        /* LOGICA DE PINTURA E BORRACHA */
        let desenhando = false;
        let ultimoX = 0;
        let ultimoY = 0;

        function obterCoordenadasCanvas(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const escalaX = canvas.width / rect.width;
            const escalaY = canvas.height / rect.height;

            return {
                x: Math.floor((clientX - rect.left) * escalaX),
                y: Math.floor((clientY - rect.top) * escalaY)
            };
        }

        function iniciarPintura(e) {
            e.preventDefault();
            const coords = obterCoordenadasCanvas(e);

            if (ferramentaAtual === 'fill') {
                preenchimentoBalde(coords.x, coords.y, corAtual, toleranciaBalde);
                return;
            }

            desenhando = true;
            ultimoX = coords.x;
            ultimoY = coords.y;
        }

        function moverPintura(e) {
            if (!desenhando || ferramentaAtual === 'fill') return;
            e.preventDefault();

            const coords = obterCoordenadasCanvas(e);

            ctx.beginPath();
            ctx.moveTo(ultimoX, ultimoY);
            ctx.lineTo(coords.x, coords.y);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (ferramentaAtual === 'eraser') {
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = espessuraPincel * 1.5;
            } else {
                ctx.strokeStyle = corAtual;
                ctx.lineWidth = espessuraPincel;
            }

            ctx.stroke();

            ultimoX = coords.x;
            ultimoY = coords.y;
        }

        function finalizarPintura(e) {
            if (desenhando) {
                desenhando = false;
                protegerLinhasDoDesenho(); // Preserva as linhas pretas originais após o traço da borracha/pincel
                salvarPassoHistorico();
            }
        }

        function definirFerramenta(ferramenta) {
            ferramentaAtual = ferramenta;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active-tool'));
            document.getElementById(`tool-${ferramenta}`).classList.add('active-tool');

            // Atualiza slider dependendo da ferramenta
            const slider = document.getElementById('dynamic-slider');
            const label = document.getElementById('slider-label');
            const valText = document.getElementById('slider-val');

            if (ferramenta === 'fill') {
                label.textContent = 'Tol:';
                slider.min = 5;
                slider.max = 100;
                slider.value = toleranciaBalde;
                valText.textContent = toleranciaBalde;
            } else {
                label.textContent = 'Tam:';
                slider.min = 2;
                slider.max = 40;
                slider.value = espessuraPincel;
                valText.textContent = espessuraPincel;
            }

            tocarSom('A4');
        }

        /* INICIALIZAÇÃO */
        function inicializar() {
            lucide.createIcons();
            renderizarPaleta();
            renderizarSelecaoImagens();

            carregarImagem(DESENHOS_CONFIGURADOS[0].src);

            // Eventos do Canvas
            canvas.addEventListener('mousedown', iniciarPintura);
            canvas.addEventListener('mousemove', moverPintura);
            canvas.addEventListener('mouseup', finalizarPintura);
            canvas.addEventListener('mouseleave', finalizarPintura);

            canvas.addEventListener('touchstart', iniciarPintura, { passive: false });
            canvas.addEventListener('touchmove', moverPintura, { passive: false });
            canvas.addEventListener('touchend', finalizarPintura);

            // Ferramentas
            document.getElementById('tool-fill').addEventListener('click', () => definirFerramenta('fill'));
            document.getElementById('tool-brush').addEventListener('click', () => definirFerramenta('brush'));
            document.getElementById('tool-eraser').addEventListener('click', () => definirFerramenta('eraser'));

            // Slider único
            document.getElementById('dynamic-slider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                document.getElementById('slider-val').textContent = val;
                if (ferramentaAtual === 'fill') {
                    toleranciaBalde = val;
                } else {
                    espessuraPincel = val;
                }
            });

            // Seletor de cor customizado
            document.getElementById('custom-color-picker').addEventListener('input', (e) => {
                selecionarCor(e.target.value);
            });

            // Ações
            document.getElementById('btn-undo').addEventListener('click', desfazer);
            document.getElementById('btn-redo').addEventListener('click', refazer);
            document.getElementById('btn-clear').addEventListener('click', () => {
                if (estadoImagemOriginal) {
                    ctx.putImageData(estadoImagemOriginal, 0, 0);
                    reiniciarHistorico();
                    tocarSom('C4');
                }
            });

            // Botões do Cabeçalho
            document.getElementById('finish-btn').addEventListener('click', () => {
                tocarSom('G5');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
            });

            document.getElementById('download-btn').addEventListener('click', () => {
                tocarSom('C5');
                const link = document.createElement('a');
                link.download = `desenho-colorido-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = inicializar;
    </script>
</body>
</html>
